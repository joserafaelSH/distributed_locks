nameOverride: ""
fullnameOverride: ""

image:
  repository: service-template
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

ports:
  http: 8080
  grpc: 9090
  pprof: 6060

service:
  type: ClusterIP

env:
  environment: local
  logLevel: info
  # Points at the shared OTel Collector deployed by the foundation's
  # Terraform. Uses in-cluster DNS — matches the correction we made when
  # Grafana's manual Tempo URL failed with the localhost address.
  otlpEndpoint: "otel-collector-opentelemetry-collector.observability:4317"

# Backing services from the foundation's infra module. Hosts are in-cluster
# DNS names (<service>.<namespace>); `localhost` doesn't work from a pod.
# Passwords are intentionally empty here: set them in values.local.yaml
# (gitignored) or with --set.
postgres:
  host: postgres-postgresql.infra
  database: mydb
  username: postgres
  password: ""

redis:
  addr: redis-master.infra:6379
  password: ""

worker:
  # How often the poller ticks (the app's own default is 60s).
  pollInterval: 10s

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

# The service is a background worker and no longer serves HTTP, so probes
# target the always-on pprof listener (the named port `pprof`).
probes:
  port: pprof
  liveness:
    path: /debug/pprof/cmdline
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    path: /debug/pprof/cmdline
    initialDelaySeconds: 5
    periodSeconds: 10

# Scraped by Pyroscope's bundled Alloy agent via profiles.grafana.com/*
# annotations — NOT pyroscope.io/* (that was our original, incorrect
# assumption, corrected after inspecting the chart's real defaults).
pyroscope:
  enabled: true

serviceMonitor:
  enabled: false
  path: /metrics
  interval: 15s